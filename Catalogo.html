<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Películas - Pillarboxed</title>
    <link rel="stylesheet" href="css/Styles.css" />
    <link rel="stylesheet" href="css/Catalogo.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">Pillarboxed</div>
      <div class="nav-links">
        <a href="Index.html">Inicio</a>
        <a href="Catalogo.html" class="activo">Películas</a>
        <a href="Proximamente.html">Series</a>
        <a href="Wishlist.html">Mi lista</a>
        <a href="Foro.html">Foro</a>
        <a href="Eventos.html">Eventos</a>
        <a href="Perfil.html">Perfil</a>
      </div>
      <div id="nav-usuario"></div>
    </nav>

    <!-- CABECERA -->
    <div class="catalogo-header">
      <div>
        <h1 class="catalogo-titulo">Películas</h1>
        <p class="catalogo-subtitulo">Explora el catálogo completo</p>
      </div>
      <div class="buscador">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.35-4.35" />
        </svg>
        <input type="text" id="input-buscar" placeholder="Buscar película..."
          autocomplete="off" />
        <button id="btn-limpiar" class="btn-limpiar">âœ•</button>
      </div>
    </div>

    <!-- TABS DE CATEGORÍA -->
    <div class="categorias-tabs">
      <button class="cat-tab activo" data-categoria="popular">Populares</button>
      <button class="cat-tab" data-categoria="top_rated">Mejor valoradas</button>
      <button class="cat-tab" data-categoria="now_playing">En cines</button>
      <button class="cat-tab" data-categoria="upcoming">Próximamente</button>
    </div>

    <!-- FILTROS DE GÉNERO -->
    <div class="filtros">
      <button class="filtro activo" data-filtro="todos">Todos</button>
      <button class="filtro" data-filtro="accion">Acción</button>
      <button class="filtro" data-filtro="drama">Drama</button>
      <button class="filtro" data-filtro="comedia">Comedia</button>
      <button class="filtro" data-filtro="terror">Terror</button>
      <button class="filtro" data-filtro="sci-fi">Sci-Fi</button>
    </div>

    <!-- GRID -->
    <section class="peliculas">
      <div class="seccion-header">
        <h2 id="catalogo-h2">Películas populares</h2>
      </div>
      <div class="grid" id="grid-peliculas"></div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/Api.js"></script>
    <script src="js/Wishlist.js"></script>
    <script src="js/Catalogo.js"></script>
  </body>
</html>
