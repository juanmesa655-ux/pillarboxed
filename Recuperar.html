<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña - Pillarboxed</title>
    <link rel="stylesheet" href="css/Login.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <h1>Pillarboxed</h1>

        <p class="subtitle">Recuperar contraseña</p>

        <!-- ── PASO 1: verificar correo ── -->
        <div id="paso1">
          <form id="formVerificar">
            <input
              type="email"
              id="emailRecuperar"
              placeholder="Correo institucional"
              required
            />
            <button type="submit">Verificar correo</button>
          </form>
        </div>

        <!-- ── PASO 2: nueva contraseña (oculto al inicio) ── -->
        <div id="paso2" style="display: none">
          <form id="formNuevaPassword">
            <div class="input-password">
              <input
                type="password"
                id="nuevaPassword"
                placeholder="Nueva contraseña"
                required
              />
              <button type="button" class="btn-ojo" onclick="togglePassword('nuevaPassword', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <div class="input-password">
              <input
                type="password"
                id="confirmarPassword"
                placeholder="Confirmar nueva contraseña"
                required
              />
              <button type="button" class="btn-ojo" onclick="togglePassword('confirmarPassword', this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <button type="submit">Guardar contraseña</button>
          </form>
        </div>

        <p class="extra-link">
          <a href="Login.html">← Volver al login</a>
        </p>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/Recuperar.js"></script>
  </body>
</html>
