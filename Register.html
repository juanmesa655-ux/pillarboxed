<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro - Pillarboxed</title>
    <link rel="stylesheet" href="css/Login.css" />
  </head>

  <body>
    <div class="login-container">
      <div class="login-card">
        <h1>Pillarboxed</h1>

        <p class="subtitle">Crear cuenta</p>

        <form id="registerForm">
          <input
            type="text"
            id="nombre"
            placeholder="Nombre completo"
            required
          />

          <input
            type="email"
            id="email"
            placeholder="Correo institucional"
            required
          />

          <div class="input-password">
            <input
              type="password"
              id="password"
              placeholder="Contraseña (mínimo 6 caracteres)"
              required
            />
            <button type="button" class="btn-ojo" onclick="togglePassword('password', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <div class="input-password">
            <input
              type="password"
              id="confirmar"
              placeholder="Confirmar contraseña"
              required
            />
            <button type="button" class="btn-ojo" onclick="togglePassword('confirmar', this)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>

          <button type="submit">Crear cuenta</button>
        </form>

        <p class="extra-link">
          ¿Ya tienes cuenta?
          <a href="Login.html">Iniciar sesión</a>
        </p>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/Register.js"></script>
  </body>
</html>
