<div class="cinema-wrap">
  <div class="projector-beam"></div>
  <div class="screen-glow"></div>

  <div class="film-strip-left">
    <div class="film-frame" *ngFor="let f of frames"></div>
  </div>
  <div class="film-strip-right">
    <div class="film-frame" *ngFor="let f of frames"></div>
  </div>

  <div class="seats-bg">
    <div class="seat-row" *ngFor="let row of seatRows" [style.bottom.px]="row.bottom">
      <div class="seat" *ngFor="let s of row.seats" [ngClass]="s"></div>
    </div>
  </div>

  <div class="login-card">
    <div class="ticket-top">
      <div class="ticket-hole"></div>
      <div class="brand">Pillarboxed</div>
      <div class="ticket-hole"></div>
    </div>

    <div class="admit-label">Restablecer contraseña</div>

    <p class="instruccion">
      Ingresa tu correo institucional y te enviaremos un enlace para restablecer tu contraseña.
    </p>

    <div class="field-group">
      <div class="field-label">Correo institucional</div>
      <input class="field-input" type="email" placeholder="usuario@pascualbravo.edu.co" [(ngModel)]="email">
    </div>

    <button class="btn-enter" (click)="onEnviar()">Enviar enlace</button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">o</span>
      <div class="divider-line"></div>
    </div>

    <button class="btn-register" (click)="goToLogin()">Volver al inicio de sesión</button>

    <div class="ticket-bottom">
      <span class="ticket-meta">Fila A · Butaca 1</span>
      <span class="ticket-meta">2026</span>
    </div>
  </div>
</div>
