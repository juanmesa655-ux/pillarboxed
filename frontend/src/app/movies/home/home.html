<nav class="navbar">
  <div class="logo">Pillarboxed</div>
  <div class="nav-links">
    <a href="#">Inicio</a>
    <a href="#">Películas</a>
    <a href="#">Series</a>
  </div>

  <div class="buscador">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8" />
      <path d="m21 21-4.35-4.35" />
    </svg>
    <input
      type="text"
      placeholder="Buscar película..."
      autocomplete="off"
      [(ngModel)]="searchText"
      (ngModelChange)="onSearchChange($event)"
    />
    @if (searchText) {
      <button class="btn-limpiar" type="button" (click)="clearSearch()">×</button>
    }
  </div>

<div class="usuario-info">
  @if (currentUsuario) {
    <span class="saludo">Hola, {{ currentUsuario.nombre }}</span>
  }
  <button class="btn-cerrar-sesion" (click)="logout()">Cerrar sesión</button>
</div>
</nav>
